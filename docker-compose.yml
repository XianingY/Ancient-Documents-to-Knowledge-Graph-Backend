services:
  redis:
    image: redis:7-alpine
    container_name: ancient_doc_redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ancient_doc_backend
    ports:
      - "3000:3000"
    volumes:
      - ./database:/app/database
      - ./pic:/app/pic
      - ./.env:/app/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=3000
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 3000"
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ancient_doc_celery_worker
    volumes:
      - ./database:/app/database
      - ./pic:/app/pic
      - ./.env:/app/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./web
    container_name: ancient_doc_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  demo_seed:
    profiles:
      - demo
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ancient_doc_demo_seed
    volumes:
      - ./database:/app/database
      - ./pic:/app/pic
      - ./.env:/app/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: "no"
    command: python scripts/seed_demo_web.py --limit 12

volumes:
  redis_data:
